services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: procure_pulse
      POSTGRES_PASSWORD: procure_pulse_dev
      POSTGRES_DB: procure_pulse_development
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U procure_pulse -d procure_pulse_development"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    working_dir: /app
    command: bash -lc "rm -f tmp/pids/server.pid && bundle exec rails server -b 0.0.0.0 -p 3000"
    environment:
      RAILS_ENV: development
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: procure_pulse_development
      DB_USERNAME: procure_pulse
      DB_PASSWORD: procure_pulse_dev
      REDIS_URL: redis://redis:6379/0
      ACTION_CABLE_REDIS_URL: redis://redis:6379/1
      DEVISE_JWT_SECRET_KEY: procure-pulse-development-only-secret-change-before-production
      RAILS_MAX_THREADS: 5
    volumes:
      - ./backend:/app
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    working_dir: /app
    command: bundle exec sidekiq
    environment:
      RAILS_ENV: development
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: procure_pulse_development
      DB_USERNAME: procure_pulse
      DB_PASSWORD: procure_pulse_dev
      REDIS_URL: redis://redis:6379/0
      ACTION_CABLE_REDIS_URL: redis://redis:6379/1
      DEVISE_JWT_SECRET_KEY: procure-pulse-development-only-secret-change-before-production
      RAILS_MAX_THREADS: 5
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_URL: http://localhost:3000/api/v1
      VITE_CABLE_URL: ws://localhost:3000/cable
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"

volumes:
  postgres_data:
  redis_data:
  frontend_node_modules:
