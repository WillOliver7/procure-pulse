default: &default
  adapter: postgresql
  encoding: unicode
  host: <%= ENV.fetch("DB_HOST", "localhost") %>
  port: <%= ENV.fetch("DB_PORT", 5433) %>
  username: <%= ENV.fetch("DB_USERNAME", "procure_pulse") %>
  password: <%= ENV.fetch("DB_PASSWORD", "procure_pulse_dev") %>
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>

development:
  <<: *default
  database: <%= ENV.fetch("DB_NAME", "procure_pulse_development") %>

test:
  <<: *default
  database: <%= ENV.fetch("TEST_DB_NAME", "backend_test") %>

production:
  <<: *default
  host: <%= ENV.fetch("DB_HOST", "localhost") %>
  port: <%= ENV.fetch("DB_PORT", 5432) %>
  database: <%= ENV.fetch("DB_NAME", "backend_production") %>
  username: <%= ENV.fetch("DB_USERNAME", "backend") %>
  password: <%= ENV.fetch("DB_PASSWORD") { ENV.fetch("BACKEND_DATABASE_PASSWORD", "") } %>
